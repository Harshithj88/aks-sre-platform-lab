{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "demo-api.fullname" . }}-limits
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-api.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.defaultCpu | quote }}
        memory: {{ .Values.limitRange.defaultMemory | quote }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu | quote }}
        memory: {{ .Values.limitRange.defaultRequestMemory | quote }}
      max:
        cpu: {{ .Values.limitRange.maxCpu | quote }}
        memory: {{ .Values.limitRange.maxMemory | quote }}
      min:
        cpu: {{ .Values.limitRange.minCpu | quote }}
        memory: {{ .Values.limitRange.minMemory | quote }}
    - type: Pod
      max:
        cpu: {{ .Values.limitRange.podMaxCpu | quote }}
        memory: {{ .Values.limitRange.podMaxMemory | quote }}
{{- end }}
