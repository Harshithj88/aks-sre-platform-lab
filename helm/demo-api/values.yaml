replicaCount: 2

image:
  repository: acrsreplatformdev.azurecr.io/demo-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: demo-api.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

serviceAccount:
  create: true
  name: demo-api

networkPolicy:
  enabled: true

resourceQuota:
  enabled: false
  requestsCpu: "2"
  requestsMemory: 4Gi
  limitsCpu: "4"
  limitsMemory: 8Gi
  maxPods: "20"
  maxServices: "10"

limitRange:
  enabled: false
  defaultCpu: 250m
  defaultMemory: 256Mi
  defaultRequestCpu: 100m
  defaultRequestMemory: 128Mi
  maxCpu: "1"
  maxMemory: 1Gi
  minCpu: 50m
  minMemory: 64Mi
  podMaxCpu: "2"
  podMaxMemory: 2Gi

env:
  ENVIRONMENT: default
